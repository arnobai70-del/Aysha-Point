name: build-android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Optional release keystore (repo secrets)
        env:
          KS_B64: ${{ secrets.AYESHA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ayesha.jks"
            echo "AYESHA_KEYSTORE=$RUNNER_TEMP/ayesha.jks" >> "$GITHUB_ENV"
          fi
      - name: Unit tests and APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          AYESHA_KEYSTORE_PASSWORD: ${{ secrets.AYESHA_KEYSTORE_PASSWORD }}
          AYESHA_KEY_ALIAS: ${{ secrets.AYESHA_KEY_ALIAS }}
          AYESHA_KEY_PASSWORD: ${{ secrets.AYESHA_KEY_PASSWORD }}
        run: gradle -p android --no-daemon testDebugUnitTest assembleRelease
      - name: Name APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ayesha-fx.apk
          sha256sum ayesha-fx.apk > ayesha-fx.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ayesha-fx-apk
          path: |
            ayesha-fx.apk
            ayesha-fx.apk.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.1.${{ github.run_number }}
          name: AYESHA FX Android 0.1.${{ github.run_number }}
          make_latest: "true"
          body: |
            Android app for AYESHA FX. Download `ayesha-fx.apk` on your phone and install.
            Setup guide: docs/06-android-guide.md. The app never places orders.
          files: |
            ayesha-fx.apk
            ayesha-fx.apk.sha256
