name: build-android
on:
  push:
    branches: [main]
    # Research-only changes (contracts/research/**, contracts/version.json) and edits of this file do not publish a
    # new APK; start this workflow by hand (Run workflow) after changing it.
    paths: ["android/**", "contracts/**", "!contracts/research/**", "!contracts/version.json",
            "desktop/ayesha/signing.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" || true
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Optional release keystore (repo secrets)
        env:
          KS_B64: ${{ secrets.AYESHA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/ayesha.keystore"
            echo "AYESHA_KEYSTORE=$RUNNER_TEMP/ayesha.keystore" >> "$GITHUB_ENV"
          fi
      - name: Unit tests and APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          AYESHA_KEYSTORE_PASSWORD: ${{ secrets.AYESHA_KEYSTORE_PASSWORD }}
          AYESHA_KEY_ALIAS: ${{ secrets.AYESHA_KEY_ALIAS }}
          AYESHA_KEY_PASSWORD: ${{ secrets.AYESHA_KEY_PASSWORD }}
        run: gradle -p android --no-daemon testDebugUnitTest assembleRelease
      - name: Name APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ayesha-fx.apk
          sha256sum ayesha-fx.apk > ayesha-fx.apk.sha256
          VN=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          HASH=$(sed -n 's/.*const val HASH = "\(.*\)".*/\1/p' android/app/src/main/java/com/ayesha/fx/core/StrategyInfo.kt)
          echo "VN=$VN" >> "$GITHUB_ENV"
          echo "STRATEGY_HASH=$HASH" >> "$GITHUB_ENV"
          echo "APK_SHA=$(cut -d' ' -f1 ayesha-fx.apk.sha256)" >> "$GITHUB_ENV"
          if [ -n "$AYESHA_KEYSTORE" ]; then echo "SIGNING=owner release key (updates keep app data)" >> "$GITHUB_ENV"; else echo "SIGNING=CI debug key (each update needs uninstall; back up the journal first)" >> "$GITHUB_ENV"; fi
          APKSIGNER=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs ayesha-fx.apk | tee signer.txt
          echo "SIGNER_SHA=$(sed -n 's/.*certificate SHA-256 digest: //p' signer.txt | head -1)" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/ayesha.keystore"
      - name: Signing self-test (throwaway PKCS12 key from `ayesha make-signing-key`, never published)
        run: |
          pip install --disable-pip-version-check -q -e "desktop[signing]"
          python -m ayesha.cli make-signing-key --out-dir "$RUNNER_TEMP/selftest" > /dev/null
          F="$RUNNER_TEMP/selftest/github-secrets-DELETE-AFTER-USE.txt"
          PW=$(sed -n '/^AYESHA_KEYSTORE_PASSWORD$/{n;p;}' "$F")
          echo "::add-mask::$PW"
          WANT=$(tail -1 "$F")
          AYESHA_KEYSTORE="$RUNNER_TEMP/selftest/ayesha-release.p12" AYESHA_KEYSTORE_PASSWORD="$PW" \
            AYESHA_KEY_ALIAS=ayesha AYESHA_KEY_PASSWORD="$PW" VERSION_CODE=1 \
            gradle -p android --no-daemon -q assembleRelease
          APKSIGNER=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)
          GOT=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "want $WANT"; echo "got  $GOT"
          [ "$GOT" = "$WANT" ]
          rm -rf "$RUNNER_TEMP/selftest"
      - uses: actions/upload-artifact@v4
        with:
          name: ayesha-fx-apk
          path: |
            ayesha-fx.apk
            ayesha-fx.apk.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VN }}-b${{ github.run_number }}
          name: AYESHA FX Android ${{ env.VN }} (build ${{ github.run_number }})
          make_latest: "true"
          body: |
            Android app for AYESHA FX. Download `ayesha-fx.apk` on your phone and install.
            Setup guide: docs/06-android-guide.md. The app never places orders.

            - App version: ${{ env.VN }} (build ${{ github.run_number }})
            - Commit: ${{ github.sha }}
            - Strategy hash: ${{ env.STRATEGY_HASH }}
            - APK SHA-256: ${{ env.APK_SHA }}
            - Signed with: ${{ env.SIGNING }}
            - Signer certificate SHA-256: ${{ env.SIGNER_SHA }} (must stay the same between releases for updates to keep your data)
            - Verification: unit tests + build only. NOT yet tested on a real Android 13 phone (see docs/VERIFICATION.md).
          files: |
            ayesha-fx.apk
            ayesha-fx.apk.sha256
