name: backtest
# Manual, on demand: multi-year validation report from OANDA practice data.
# Needs the repository secret AYESHA_OANDA_TOKEN. Prefer desktop\windows\backtest-local.bat if you
# do not want the token stored in GitHub at all.
#
# Hardening:
# - workflow_dispatch inputs are never written into a shell command. They are passed as environment
#   variables, always quoted, and validated by `ayesha backtest-run` (pair allowlist from the strategy
#   spec, integer ranges, real dates inside the data) before anything else runs.
# - The token is exposed only to the single step that downloads prices, as an environment variable
#   (never an argument). GitHub masks it in logs; the code never prints it.
# - Price data stays in the runner's temp folder; only the two report files are uploaded.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "History length in days (30..3650; 1095 = 3 years)"
        default: "1095"
      pairs:
        description: "Comma-separated pairs from the enabled list"
        default: "EURUSD,GBPUSD,USDJPY,AUDUSD,USDCAD,EURJPY"
      split:
        description: "In-sample / out-of-sample split date YYYY-MM-DD; empty = middle of the data"
        default: ""
      folds:
        description: "Walk-forward folds (2..12)"
        default: "4"

permissions:
  contents: read

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IN_DAYS: ${{ inputs.days }}
      IN_PAIRS: ${{ inputs.pairs }}
      IN_SPLIT: ${{ inputs.split }}
      IN_FOLDS: ${{ inputs.folds }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: desktop
        run: pip install --disable-pip-version-check -q -e .
      - name: Validate inputs (no token in this step)
        working-directory: desktop
        run: python -m ayesha.cli backtest-run --pairs "$IN_PAIRS" --days "$IN_DAYS" --split "$IN_SPLIT" --folds "$IN_FOLDS" --validate-only
      - name: Check the token secret exists
        env:
          HAS_TOKEN: ${{ secrets.AYESHA_OANDA_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add the repository secret AYESHA_OANDA_TOKEN first, or run backtest-local.bat on your PC instead."
            exit 1
          fi
      - name: Export OANDA history and build the report
        working-directory: desktop
        env:
          AYESHA_OANDA_TOKEN: ${{ secrets.AYESHA_OANDA_TOKEN }}
          AYESHA_HOME: ${{ runner.temp }}/ayesha-home
        run: python -m ayesha.cli backtest-run --pairs "$IN_PAIRS" --days "$IN_DAYS" --split "$IN_SPLIT" --folds "$IN_FOLDS" --out-dir "$RUNNER_TEMP/bt"
      - name: Collect report files only (no price data)
        run: |
          mkdir -p report
          cp "$RUNNER_TEMP/bt/backtest-report.md" "$RUNNER_TEMP/bt/backtest-report.json" report/
          cat report/backtest-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: report/
          retention-days: 30
