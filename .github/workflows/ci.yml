name: ci
on:
  push:
  pull_request:
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Safety scan (no order execution code)
        run: python scripts/check_no_order_api.py .
      - name: Install deps for Pine check
        run: pip install pyyaml tzdata
      - name: Pine file matches strategy spec
        run: python scripts/generate_pine.py --check
      - name: Install
        working-directory: desktop
        run: pip install -e ".[dev]"
      - name: Tests
        working-directory: desktop
        run: pytest -q
      - name: Doctor runs without credentials (reports what is missing, never crashes)
        working-directory: desktop
        shell: bash
        run: |
          set +e
          out=$(python -m ayesha.cli doctor --no-publish 2>&1); rc=$?
          echo "$out"
          [ $rc -eq 1 ] && echo "$out" | grep -q "FAIL  OANDA token: missing"
      - name: Windows start script stops cleanly before setup
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call desktop\windows\start-ayesha.bat < NUL > start.log 2>&1
          type start.log
          findstr /C:"Run install.bat first" start.log

  relay:
    # Live check of the opt-in PC -> phone relay (ntfy.sh): publish signed, read back, verify.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml tzdata
      - name: Relay round trip
        run: python scripts/relay_roundtrip.py

  news:
    # Live check that the Forex Factory weekly calendar can be fetched and parsed (the news gate's source).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: desktop
        run: pip install -e .
      - name: Fetch and parse this week's calendar
        working-directory: desktop
        run: |
          python - <<'PY'
          from pathlib import Path
          from ayesha.news.ff_feed import FFCalendarSource
          src = FFCalendarSource(Path("ff_cache.json"))
          cal = src.calendar(before_min=30, after_min=30, impacts=("HIGH",))
          assert cal is not None, f"calendar unavailable: {src.last_error}"
          high = [e for e in cal.events if e.impact == "HIGH"]
          print(f"events {len(cal.events)}, high impact {len(high)}, coverage {cal.coverage[0]} .. {cal.coverage[1]}")
          assert cal.events, "no events parsed"
          PY
