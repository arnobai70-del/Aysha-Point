# AYESHA canonical strategy contract.
# Python loads this file at runtime; Pine constants are generated from it (phase 6).
# Any change here changes strategy_hash, which is shown in every signal.
strategy_version: "0.4.0"

account:
  broker: Exness
  account_type: Standard        # Standard | StandardCent | Other
  currency: USD

risk:
  risk_per_trade_percent: 0.5   # default; hard cap below
  max_risk_per_trade_percent: 1.0
  max_open_risk_percent: 1.0
  max_daily_loss_percent: 2.0
  max_losses_per_day: 2
  max_same_currency_positions: 1  # correlated exposure, e.g. two USD-short trades
  min_net_rr: 2.0
  max_spread_pips: 1.5
  slippage_buffer_pips: 0.3
  min_stop_atr_fraction: 0.5    # SL tighter than 0.5 * ATR(M15) => NO_TRADE
  max_quote_age_seconds: 30
  strict_news: true             # unknown calendar => NO_TRADE

pairs:
  enabled: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, EURJPY]
  disabled: [NZDUSD, USDCHF, EURGBP, XAUUSD, USOIL, BTCUSD]

sessions:   # local times in each IANA zone; DST handled by zoneinfo
  SYDNEY:  {tz: Australia/Sydney,  start: "07:00", end: "16:00"}
  TOKYO:   {tz: Asia/Tokyo,        start: "09:00", end: "18:00"}
  LONDON:  {tz: Europe/London,     start: "08:00", end: "17:00"}
  NEW_YORK: {tz: America/New_York, start: "08:00", end: "17:00"}
  trade_sessions: [LONDON, NEW_YORK]
  asia_range: {tz: Asia/Tokyo, start: "09:00", end: "15:00"}
  rollover: {tz: America/New_York, start: "16:55", end: "17:10"}
  week_open: {tz: America/New_York, weekday: 6, time: "17:00"}   # Sunday
  week_close: {tz: America/New_York, weekday: 4, time: "17:00"}  # Friday

rules:
  atr_period: 14
  swing_left_bars: 3
  swing_right_bars: 3
  bos_buffer_atr: 0.05          # close must exceed swing by this * ATR
  displacement_body_atr: 1.2    # body >= 1.2 * ATR
  displacement_body_frac: 0.6   # body / range
  fvg_min_gap_atr: 0.1
  fvg_max_age_bars: 40
  eq_tolerance_atr: 0.1         # equal highs/lows tolerance
  sweep_min_penetration_atr: 0.05
  sweep_reclaim_bars: 3
  mss_within_bars: 12           # MSS must follow the sweep within N bars

entry:
  setup: SWEEP_MSS_FVG
  entry_mode: proximal          # proximal | midpoint
  sl_buffer_atr: 0.1
  expiry_bars: 8
  setup_timeframe: M15
  bias_timeframe: H1
  require_htf_bias: false       # countertrend allowed only with stricter score

mtf:   # one combined setup per pair; higher timeframes give context, never their own signals
  context_timeframe: H4         # major structure; shown in every signal
  # bias timeframe = entry.bias_timeframe (H1): bias, last BOS/CHoCH, premium/discount of the H1 range
  # setup timeframe = entry.setup_timeframe (M15): SWEEP -> MSS -> FVG candidate
  block_against_context: true   # reject when H1 AND H4 both point against the setup
  confirm_timeframe: null       # M5 = wait for an M5 confirmation candle before READY; null = off
  confirm_within_bars: 6        # M5 bars allowed after price first touches the entry zone
  confirm_body_atr: 0.8         # M5 confirmation candle body >= this * ATR(M5)
  scalp_m1:
    enabled: false              # NOT validated; the scanner refuses to run with this on
    validated: false

news:   # protection only; news analysis (scenarios, reactions) is advisory and never gates a trade
  rules_version: "1.0"
  block_minutes_before: 30      # legacy HIGH-impact window: the floor for every HIGH+ tier below
  block_minutes_after: 30
  impacts_blocked: [HIGH]
  tiers:   # minutes; proposed research defaults (News spec A2), NOT statistically optimised
    CENTRAL_BANK: {before: 45, after: 60}   # rate decisions, FOMC, policy statements, press conferences
    TOP_DATA:     {before: 45, after: 30}   # CPI, non-farm payrolls, core PCE
    HIGH:         {before: 30, after: 30}
    MEDIUM:       {before: 10, after: 10}
    LOW:          {before: 0, after: 0}     # informational; blocks only if M5 shows a shock
  global_currencies: [USD]      # TOP_DATA / CENTRAL_BANK USD events block every enabled pair
  upcoming_notice_minutes: 60   # UPCOMING phase + phone notice; a READY must expire before a lockout
  event_live_minutes: 5
  reaction_watch_max_minutes: 120   # pre-event baseline compared for at most this long after the window;
                                    # later the always-on gates (hard spread cap, quote age) still apply
  source_max_age_hours: 24      # older calendar => NEWS_UNVERIFIED
  max_clock_skew_minutes: 5
  stability:   # REACTION_WATCH -> CLEAR needs closed M5 bars near the pre-event baseline
    baseline_minutes: 120
    min_baseline_bars: 12
    closed_bars_after: 2
    spread_ratio_max: 1.5
    spread_abs_slack_pips: 0.2
    range_ratio_max: 2.0
    shock_ratio: 3.0            # low/medium event with an M5 range > 3x baseline is treated as high risk
    whipsaw_ratio: 3.0          # big moves both ways after the release: blocked for the whole reaction watch
    shock_extend_minutes: 30    # a shock bar extends the cooldown by this long after it closes

capital:   # Exness equity typed by the owner (no broker API); OANDA's practice balance is never used
  rules_version: "1.0"
  source: OWNER_ENTERED
  max_age_hours: 24             # a READY needs a capital confirmation younger than this
  max_age_after_change_hours: 4 # ... or this, after a deposit/withdrawal or a large change
  large_change_percent: 25
  positions_max_age_hours: 12   # open trades / free margin confirmed once per session
  news_leverage_cap: 200        # margin is checked at no more than 1:200 (Exness limits leverage around news)
  # warnings only (News spec B4): they never block or loosen a hard gate
  weekly_drawdown_warning_percent: 4.0  # equity this far below its 7-day high, deposits/withdrawals excluded
  freshness_warning_hours: 2            # capital / open-trades confirmation expires within this

scoring:
  a_plus: 85
  watch: 70

feed:
  server_utc_offset_hours: 0    # verify with `ayesha spec-check` (server_offset_estimate_hours)
  warmup_days: 20
  poll_seconds: 20
  stale_after_bars: 2           # no new closed bar for 2 bars while market open => DATA_STALE

delivery:
  notify_grades: [A_PLUS]       # READY alerts only for these grades; WATCH is journal/quiet
  heartbeat_seconds: 300        # PC -> phone "scanner alive" ping (also sent at once on state change)
